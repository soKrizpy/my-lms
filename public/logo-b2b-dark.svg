<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Transparent background, white monochrome -->
  <defs>
    <pattern id="hex-dark" x="0" y="0" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M14 2 L26 8 L26 20 L14 26 L2 20 L2 8 Z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow-white">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circle border (white) -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4"/>
  <circle cx="100" cy="100" r="92" fill="url(#hex-dark)"/>

  <!-- Letter B (left) — white -->
  <path d="M32 60 L32 140 L58 140 Q80 140 80 122 Q80 112 72 108 Q80 104 80 92 Q80 60 58 60 Z
           M46 95 L46 72 L56 72 Q66 72 66 84 Q66 95 56 95 Z
           M46 128 L46 107 L58 107 Q70 107 70 118 Q70 128 58 128 Z"
        fill="white" filter="url(#glow-white)"/>

  <!-- Number 2 (center) — white -->
  <path d="M84 68 Q84 56 100 56 Q116 56 116 68 Q116 80 100 92 L84 108 L116 108 L116 120 L84 120 L84 108 Q100 96 108 88 Q112 84 112 72 Q112 64 104 64 Q96 64 96 72 L96 76 L84 76 Z"
        fill="white" filter="url(#glow-white)"/>

  <!-- Letter B (right) — white -->
  <path d="M120 60 L120 140 L146 140 Q168 140 168 122 Q168 112 160 108 Q168 104 168 92 Q168 60 146 60 Z
           M134 95 L134 72 L144 72 Q154 72 154 84 Q154 95 144 95 Z
           M134 128 L134 107 L146 107 Q158 107 158 118 Q158 128 146 128 Z"
        fill="white" filter="url(#glow-white)"/>

  <!-- Circuit dots — white -->
  <circle cx="50" cy="148" r="3" fill="white" opacity="0.8"/>
  <circle cx="62" cy="155" r="2" fill="white" opacity="0.6"/>
  <circle cx="100" cy="150" r="3" fill="white" opacity="0.8"/>
  <circle cx="115" cy="145" r="2" fill="white" opacity="0.6"/>
  <circle cx="138" cy="152" r="3" fill="white" opacity="0.7"/>
  <line x1="50" y1="148" x2="62" y2="148" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="62" y1="148" x2="62" y2="155" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="150" x2="115" y2="150" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="150" x2="115" y2="145" stroke="white" stroke-width="1.5" opacity="0.5"/>
</svg>
